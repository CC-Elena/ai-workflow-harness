# PRD 结构化示例

# 功能名称
name: 知识库权限管理

# 功能描述
description: 为知识库提供细粒度的权限管理能力，支持按成员和角色设置读写权限

# 版本信息
version: 1.0.0
status: draft

# 用户故事
user_stories:
  - id: US001
    role: 知识库管理员
    action: 设置成员权限
    benefit: 控制谁可以查看或编辑知识库内容
  
  - id: US002
    role: 普通成员
    action: 查看自己的权限
    benefit: 了解自己在知识库中的操作范围

# 功能需求
features:
  - id: F001
    name: 权限列表展示
    priority: P0
    description: 展示当前知识库的所有成员及其权限
    acceptance_criteria:
      - 显示成员头像、姓名、邮箱
      - 显示权限级别（管理员/编辑者/查看者）
      - 支持分页和搜索
  
  - id: F002
    name: 添加成员
    priority: P0
    description: 搜索并添加新成员到知识库
    acceptance_criteria:
      - 支持按姓名/邮箱搜索
      - 选择权限级别
      - 添加成功后刷新列表
  
  - id: F003
    name: 修改权限
    priority: P1
    description: 修改已有成员的权限级别
    acceptance_criteria:
      - 下拉选择新权限
      - 确认后立即生效

# 非功能需求
non_functional:
  - 权限变更操作需 < 500ms
  - 列表加载需 < 1s
  - 支持国际化（中/英）

# 接口依赖
apis:
  - name: getMembers
    method: GET
    path: /api/knowledge/{id}/members
    description: 获取成员列表
  
  - name: addMember
    method: POST
    path: /api/knowledge/{id}/members
    description: 添加成员
  
  - name: updatePermission
    method: PUT
    path: /api/knowledge/{id}/members/{memberId}
    description: 更新权限

# 设计稿链接
design_links:
  - 主界面: https://figma.com/xxx
  - 空态: https://figma.com/yyy
