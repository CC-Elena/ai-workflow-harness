name: Harness CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Verify harness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Harness PR gate
        if: github.event_name == 'pull_request'
        run: npm run harness:check -- --changed --base ${{ github.event.pull_request.base.sha }} --head ${{ github.event.pull_request.head.sha }}

      - name: Harness sample regression
        if: github.event_name != 'pull_request'
        run: npm run harness:check -- specs/failure-rca-sample
