name: Harness CI

concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Verify harness
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Anti-corruption quality gate
        run: npm run quality:gate

      - name: Typecheck
        run: npm run typecheck

      - name: Runtime contracts, eval, trace, migration, and fixture tests
        run: npm run harness:beta:test

      - name: Legacy harness regression
        run: npm run harness:test

      - name: Build
        run: npm run build

      - name: Harness PR gate
        if: github.event_name == 'pull_request'
        run: npm run harness:check -- --changed --base ${{ github.event.pull_request.base.sha }} --head ${{ github.event.pull_request.head.sha }}

      - name: Harness sample regression
        if: github.event_name != 'pull_request'
        run: npm run harness:check -- specs/failure-rca-sample

      - name: Upload Harness run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-run-evidence
          path: .harness/runs
          if-no-files-found: warn
          retention-days: 14
